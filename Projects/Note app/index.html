<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Notes App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-6">

    <div class="flex flex-col items-center w-full max-w-[900px] mx-auto mt-10 gap-6 bg-white/20 backdrop-blur-2xl p-6 rounded-xl shadow-xl border border-white/40">

        <!-- Title Input -->
        <div class="flex flex-col w-full">
            <h4 class="text-lg font-semibold text-white">Title</h4>
            <input class="input_title w-full border-2 border-gray-300 p-3 rounded-md bg-white/70 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter title...">
        </div>

        <!-- Description Input -->
        <div class="flex flex-col w-full">
            <h4 class="text-lg font-semibold text-white">Description</h4>
            <textarea class="input_des w-full h-[12vh] border-2 border-gray-300 p-3 rounded-md resize-none bg-white/70 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter description..."></textarea>
        </div>


<!-- Color Picker -->
<div class="flex flex-col w-full">
    <h4 class="text-lg font-semibold text-white">Select Note Color</h4>
    <input type="color" class="input_color w-full h-10 rounded-md border-2 border-gray-300 bg-white/70 cursor-pointer" value="#ffffff">
</div>



        <!-- Add Note Button -->
        <button class="add_btn w-full sm:w-[40%] h-[6vh] bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg shadow-lg hover:bg-blue-600 hover:scale-105 hover:shadow-blue-500/50 transition-all duration-300">➕ Add Note</button>

        <!-- Notes Heading -->
        <div class="w-full flex flex-col items-center">
            <div class="w-full border-t border-white/50 my-2"></div>
            <h1 class="text-3xl font-bold text-white py-2">📝 Your Notes</h1>
            <div class="w-full border-b border-white/50 my-2"></div>
        </div>

        <!-- Notes Boxes -->
        <div class="box_container w-full flex flex-wrap gap-4 justify-center">
            <!-- Default Note -->
            <div id="default-note" class="w-full sm:w-[45%] md:w-[30%] border-purple-400 border-2 rounded-lg flex flex-col items-center gap-4 p-4 bg-white/30 backdrop-blur-md shadow-lg">
                <h5 class="bg-white/50 w-full text-center p-2 text-gray-800 font-semibold rounded-md">Add Title</h5>
                <p class="text-gray-200 text-sm">Description of note goes here...</p>
                <div class="flex flex-row gap-3 w-full">
                    <button class="del_btn w-full h-[5vh] bg-red-500 text-white rounded-lg hover:bg-red-600 hover:scale-105 hover:shadow-red-500/50 transition-all duration-300">❌ Delete</button>
                    <button class="update_btn w-full h-[5vh] bg-green-500 text-white rounded-lg hover:bg-green-600 hover:scale-105 hover:shadow-green-500/50 transition-all duration-300">✏️ Update</button>
                </div> 
            </div>
        </div>

    </div>

    <!-- Script File -->
    <script src="script.js"></script>

</body>
</html>
